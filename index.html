<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dad Football Tracker</title>
  <link rel="stylesheet" href="./assets/styles.css" />
</head>
<body>
  <header>
    <div class="wrap nav">
      <div class="brand">
        <strong>Dad Football Tracker</strong>
        <span class="muted">Pick a league + team, add attended games</span>
      </div>
      <div class="tabs">
        <a class="tab" href="./index.html">Home</a>
        <a class="tab" href="./stats.html">Stats</a>
      </div>
    </div>
  </header>

  <main>
    <div class="wrap grid">
      <section class="card">
        <h2>Add a match</h2>
        <p class="muted" style="margin-top:0">
          Choose a league, then a team. We’ll load league matches and filter them to your team.
        </p>

        <div class="row">
          <div>
            <label for="leagueSelect">League</label>
            <select id="leagueSelect"></select>
          </div>

          <div>
            <label for="teamSelect">Team</label>
            <select id="teamSelect" disabled></select>
          </div>

          <div style="min-width: 140px; flex: 0 0 180px;">
            <label>&nbsp;</label>
            <button id="loadMatchesBtn" disabled>Load matches</button>
          </div>
        </div>

        <div id="msg" class="toast muted" style="display:none;"></div>

        <div style="margin-top: 12px; overflow:auto;">
          <table class="table" id="resultsTable" style="display:none;">
            <thead>
              <tr>
                <th>Date</th>
                <th>Match</th>
                <th>League</th>
                <th>Venue</th>
                <th>Score</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="resultsBody"></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>

  <script type="module" src="./assets/home.js"></script>
</body>
</html>
