<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dad Football Tracker</title>
  <link rel="stylesheet" href="./assets/styles.css" />
</head>
<body>
  <header>
    <div class="wrap nav">
      <div class="brand">
        <strong>Dad Football Tracker</strong>
        <span class="muted">Leeds United • searches + match visits</span>
      </div>
      <div class="tabs">
        <a class="tab" href="./index.html">Home</a>
        <a class="tab" href="./stats.html">Stats</a>
      </div>
    </div>
  </header>

  <main>
    <div class="wrap grid">

      <section class="card">
        <h2>Find a Leeds match to add</h2>

        <div class="row">
          <div>
            <label for="season">Season (year)</label>
            <input id="season" type="number" min="2010" max="2100" />
          </div>
          <div>
            <label for="from">From (optional)</label>
            <input id="from" type="date" />
          </div>
          <div>
            <label for="to">To (optional)</label>
            <input id="to" type="date" />
          </div>
          <div style="min-width: 140px; flex: 0 0 160px;">
            <label>&nbsp;</label>
            <button id="searchBtn">Search fixtures</button>
          </div>
        </div>

        <div id="searchMsg" class="toast muted" style="display:none;"></div>

        <div style="margin-top: 12px; overflow:auto;">
          <table class="table" id="resultsTable" style="display:none;">
            <thead>
              <tr>
                <th>Date</th>
                <th>Match</th>
                <th>Comp</th>
                <th>Venue</th>
                <th>Score</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="resultsBody"></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>

  <script type="module" src="./assets/home.js"></script>
</body>
</html>
