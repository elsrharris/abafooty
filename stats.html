<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dad Football Stats</title>
  <link rel="stylesheet" href="./assets/styles.css" />
</head>
<body>
  <header>
    <div class="wrap nav">
      <div class="brand">
        <strong>Dad Football Tracker</strong>
        <span class="muted">Stats • attended games</span>
      </div>
      <div class="tabs">
        <a class="tab" href="./index.html">Home</a>
        <a class="tab" href="./stats.html">Stats</a>
      </div>
    </div>
  </header>

  <main>
    <div class="wrap grid">
      <section class="card">
        <h2>Overview</h2>
        <div class="kpis" id="kpis"></div>
        <div class="muted" style="margin-top:10px; font-size:13px;">
          Matches are stored in this browser (localStorage).
        </div>
      </section>

      <section class="card">
        <h2>All attended matches</h2>
        <div style="overflow:auto;">
          <table class="table">
            <thead>
              <tr>
                <th>Date</th>
                <th>Match</th>
                <th>League</th>
                <th>Venue</th>
                <th>Result</th>
                <th>Detail</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="list"></tbody>
          </table>
        </div>
      </section>

      <section class="card">
        <h2>Breakdowns</h2>
        <div class="row">
          <div>
            <h3 style="margin:0 0 8px 0; font-size:14px;">By league</h3>
            <div id="byLeague" class="muted"></div>
          </div>
          <div>
            <h3 style="margin:0 0 8px 0; font-size:14px;">By venue</h3>
            <div id="byVenue" class="muted"></div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script type="module" src="./assets/stats.js"></script>
</body>
</html>
